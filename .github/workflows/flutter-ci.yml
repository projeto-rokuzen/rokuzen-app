name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # O projeto Flutter nasce quando alguem roda scripts/bootstrap.sh e commita
      # o resultado. Ate la, o CI passa sem verificar nada — assim a main nao fica
      # vermelha por um motivo que ninguem pode corrigir ainda.
      - name: Verificar se o projeto Flutter ja existe
        id: projeto
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app/ ainda nao tem projeto Flutter. Rode scripts/bootstrap.sh e commite o resultado para o CI comecar a verificar de verdade."
          fi

      - name: Instalar Flutter
        if: steps.projeto.outputs.existe == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        if: steps.projeto.outputs.existe == 'true'
        working-directory: app
        run: flutter pub get

      # firebase_options.dart nao e versionado; o CI usa um stub para compilar.
      - name: Gerar stub de configuracao do Firebase
        if: steps.projeto.outputs.existe == 'true'
        working-directory: app
        run: |
          if [ -f lib/firebase_options.example.dart ]; then
            cp lib/firebase_options.example.dart lib/firebase_options.dart
          fi

      - name: Verificar formatacao
        if: steps.projeto.outputs.existe == 'true'
        working-directory: app
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisar
        if: steps.projeto.outputs.existe == 'true'
        working-directory: app
        run: flutter analyze

      - name: Testar
        if: steps.projeto.outputs.existe == 'true'
        working-directory: app
        run: flutter test
